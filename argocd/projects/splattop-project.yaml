apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: splattop
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: SplatTop production project (default + monitoring namespaces)

  sourceRepos:
    - https://github.com/cesaregarza/GarzAICluster
    - https://github.com/cesaregarza/agent-platform
    - git@github.com:cesaregarza/agent-platform.git

  destinations:
    - namespace: default
      server: https://kubernetes.default.svc
    - namespace: citrus
      server: https://kubernetes.default.svc
    - namespace: citrus-dev
      server: https://kubernetes.default.svc
    - namespace: splatvote-prod
      server: https://kubernetes.default.svc
    - namespace: monitoring
      server: https://kubernetes.default.svc
    - namespace: external-dns
      server: https://kubernetes.default.svc
    - namespace: vanity-hosts
      server: https://kubernetes.default.svc
    - namespace: garz-ai
      server: https://kubernetes.default.svc
    - namespace: poetry
      server: https://kubernetes.default.svc
    - namespace: agent-control-plane
      server: https://kubernetes.default.svc
    - namespace: agent-workloads
      server: https://kubernetes.default.svc
    - namespace: cegarza-blog
      server: https://kubernetes.default.svc
    - namespace: kube-system
      server: https://kubernetes.default.svc
    - namespace: argocd
      server: https://kubernetes.default.svc

  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: cert-manager.io
      kind: Certificate
    - group: cert-manager.io
      kind: ClusterIssuer
    - group: argoproj.io
      kind: ApplicationSet
    - group: apiregistration.k8s.io
      kind: APIService

  namespaceResourceWhitelist:
    - group: ''
      kind: Service
    - group: ''
      kind: ServiceAccount
    - group: ''
      kind: ConfigMap
    - group: ''
      kind: Secret
    - group: ''
      kind: PersistentVolumeClaim
    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
    - group: batch
      kind: Job
    - group: batch
      kind: CronJob
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
    - group: networking.k8s.io
      kind: Ingress
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: cilium.io
      kind: CiliumNetworkPolicy
    - group: policy
      kind: PodDisruptionBudget
    - group: cert-manager.io
      kind: Certificate
    - group: argoproj.io
      kind: ApplicationSet
    - group: argoproj.io
      kind: Application

  orphanedResources:
    warn: true
    ignore:
      - group: ''
        kind: Secret
        name: regcred
      - group: ''
        kind: Secret
        name: vote-db-secrets
      - group: ''
        kind: Secret
        name: db-secrets
      - group: ''
        kind: Secret
        name: grafana-admin-credentials
      - group: ''
        kind: Secret
        name: alertmanager-config
      - group: ''
        kind: Secret
        name: tls-secret
      # cert-manager ingress-shim output for the tracked citrus-dev Ingress.
      # Keep this exact-name exception scoped to the generated dev TLS Secret.
      - group: ''
        kind: Secret
        name: citrus-dev-grace-tls
      # Runner-created per-SHA outcome evidence. This fixed name is intentionally
      # not chart-managed so Argo self-heal cannot erase durable pass/fail state.
      - group: ''
        kind: ConfigMap
        name: citrus-dev-stripe-smoke-receipts
      - group: ''
        kind: Secret
        name: blog-db-secrets
      - group: ''
        kind: Secret
        name: teams-refresh-db-secrets
      - group: ''
        kind: Secret
        name: blog-tls-secret
      - group: ''
        kind: Secret
        name: cegarza-blog-secrets
      - group: ''
        kind: Secret
        name: cegarza-dev-tls
      - group: ''
        kind: Secret
        name: cegarza-apex-tls
      - group: ''
        kind: Secret
        name: spotify-hot-100-tls
      - group: ''
        kind: Secret
        name: grafana-tls
      - group: ''
        kind: Secret
        name: justflip-garz-ai-tls
      - group: ''
        kind: Secret
        name: agent-control-plane-secrets
      - group: ''
        kind: Secret
        name: agent-control-plane-tls
      - group: ''
        kind: Secret
        name: agent-workloads-secrets
      - group: ''
        kind: ConfigMap
        name: kube-root-ca.crt

  roles:
    - name: admin
      description: Admin access scoped to SplatTop production
      policies:
        - p, proj:splattop:admin, applications, *, splattop/*, allow
      groups:
        - splattop-admins
