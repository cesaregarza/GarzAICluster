apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: poetry
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: splattop
  source:
    repoURL: https://github.com/cesaregarza/GarzAICluster
    targetRevision: main
    path: helm/poetry
    helm:
      releaseName: poetry
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: poetry
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
  revisionHistoryLimit: 10
