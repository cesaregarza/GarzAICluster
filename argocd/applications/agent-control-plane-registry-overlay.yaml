apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agent-control-plane-registry-overlay
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "9"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: splattop
  # Keep the overlay and generated hook Jobs in one Helm source. A legacy
  # singular-source sync request can otherwise silently omit a second source
  # while reporting the Kustomize resources as successfully synced.
  source:
    repoURL: https://github.com/cesaregarza/GarzAICluster
    targetRevision: main
    path: apps/agent-control-plane-registry-overlay
    # This path intentionally retains kustomization.yaml for local render
    # equivalence. Select Helm with a non-empty field that survives Kubernetes
    # CRD normalization so Argo cannot auto-detect the Kustomize input and
    # silently omit the rollout-strategy and restart hooks.
    helm:
      releaseName: agent-control-plane-registry-overlay
  destination:
    server: https://kubernetes.default.svc
    namespace: agent-control-plane
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Do not add ApplyOutOfSyncOnly=true here. Argo CD selective syncs skip
      # hooks, and this app relies on its PostSync restart hook for CES-108.
  revisionHistoryLimit: 10
