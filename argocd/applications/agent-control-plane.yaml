apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agent-control-plane
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: splattop
  sources:
    - repoURL: git@github.com:cesaregarza/agent-platform.git
      targetRevision: f9694ead635184f12afc0e66c7f608df0743823c
      path: helm/mandate
      helm:
        releaseName: agent-control-plane
        valueFiles:
          - $values/apps/agent-control-plane/values.yaml
    - repoURL: https://github.com/cesaregarza/GarzAICluster
      targetRevision: main
      ref: values
    - repoURL: https://github.com/cesaregarza/GarzAICluster
      targetRevision: main
      path: apps/agent-control-plane-runtime-controls
  destination:
    server: https://kubernetes.default.svc
    namespace: agent-control-plane
  # The registry-overlay rollout-strategy Sync hook owns these two fields for
  # the four singleton RollingUpdate Deployments. The pinned reusable chart
  # omits them, so ignore only the externally managed numeric strategy leaves.
  # Model-gateway remains chart-owned Recreate for the shared RWO auth PVC.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: agent-control-plane
      namespace: agent-control-plane
      jsonPointers:
        - /spec/strategy/rollingUpdate/maxSurge
        - /spec/strategy/rollingUpdate/maxUnavailable
    - group: apps
      kind: Deployment
      name: agent-control-plane-callback-adapter
      namespace: agent-control-plane
      jsonPointers:
        - /spec/strategy/rollingUpdate/maxSurge
        - /spec/strategy/rollingUpdate/maxUnavailable
    - group: apps
      kind: Deployment
      name: agent-control-plane-git-deliverer
      namespace: agent-control-plane
      jsonPointers:
        - /spec/strategy/rollingUpdate/maxSurge
        - /spec/strategy/rollingUpdate/maxUnavailable
    - group: apps
      kind: Deployment
      name: agent-control-plane-local-worker
      namespace: agent-control-plane
      jsonPointers:
        - /spec/strategy/rollingUpdate/maxSurge
        - /spec/strategy/rollingUpdate/maxUnavailable
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
  revisionHistoryLimit: 10
