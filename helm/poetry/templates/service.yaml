{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "poetry.fullname" . }}
  labels:
    {{- include "poetry.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "poetry.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
