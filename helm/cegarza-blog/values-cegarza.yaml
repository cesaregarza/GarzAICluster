global:
  environment: production
  imagePullSecrets:
  - regcred
  databaseSecretName: cegarza-blog-secrets
  appImageTag: v1.0.36

fullnameOverride: cegarza-blog

blog:
  enabled: true
  replicas: 1
  selectorName: cegarza-blog
  replaceOnSync: false
  strategy:
    type: Recreate
  image:
    repository: registry.digitalocean.com/sendouq/cegarza-blog
    tag: v1.0.42
    digest: sha256:bc88644c46dc67a7d9eaf809370c56fb0c44f1d107139ad81bee0c85f812a23a
    pullPolicy: IfNotPresent
  secretKeys:
  - DATABASE_URL
  - DJANGO_SECRET_KEY
  env:
    DJANGO_SETTINGS_MODULE: cegarza_site.settings
    DEBUG: "false"
    ALLOWED_HOSTS: cegarza.com,www.cegarza.com,dev.cegarza.com
    CSRF_TRUSTED_ORIGINS: https://cegarza.com,https://www.cegarza.com,https://dev.cegarza.com
    SECURE_HSTS_SECONDS: "31536000"
    SECURE_HSTS_INCLUDE_SUBDOMAINS: "false"
    SECURE_HSTS_PRELOAD: "false"
    SERVE_MEDIA: "true"
    USE_SPACES: "false"
    SITE_NAME: Bringing Down The Gauss
    SITE_DESCRIPTION: Thoughts, stories and ideas.
    SITE_AUTHOR: Cesar Garza
    WAGTAILADMIN_BASE_URL: https://cegarza.com/admin/
    ALLOWED_EMBED_HOSTS: cesaregarza.github.io
    SITE_SAMEAS: "https://github.com/cesaregarza,https://linkedin.com/in/cegarza"
    CSP_ENFORCE: "true"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    enabled: true
    existingClaim: ""
    accessMode: ReadWriteOnce
    size: 5Gi
    storageClass: do-block-storage
    retainOnDelete: true
  health:
    enabled: true
    path: /health/
    port: 8000
    hostHeader: dev.cegarza.com
  migrations:
    enabled: true
    hook: pre-install,pre-upgrade
    backoffLimit: 3
  databaseTLS:
    enabled: true
    secretName: cegarza-blog-secrets
    secretKey: DB_CA_CERT
    caMountPath: /etc/database-ca
    caFileName: ca.crt

ingress:
  enabled: true
  className: nginx
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
    external-dns.alpha.kubernetes.io/ttl: "60"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
  - host: cegarza.com
    paths:
    - path: /
      pathType: Prefix
      servicePort: 8000
  - host: www.cegarza.com
    paths:
    - path: /
      pathType: Prefix
      servicePort: 8000
  - host: dev.cegarza.com
    paths:
    - path: /
      pathType: Prefix
      servicePort: 8000
  tls:
    enabled: true
    secretName: cegarza-dev-tls
    certificate:
      enabled: true
      dnsNames:
      - cegarza.com
      - www.cegarza.com
      - dev.cegarza.com

networkPolicy:
  enabled: true
  selectorNames:
  - cegarza-blog
  ingress:
    namespace: ingress-nginx
    podLabels:
      app.kubernetes.io/name: ingress-nginx
      app.kubernetes.io/instance: nginx-ingress
    port: 8000
  egress:
    dns:
      namespace: kube-system
      podLabels:
        k8s-app: kube-dns
    database:
      host: private-db-postgresql-nyc3-xscraper-do-user-15543770-0.c.db.ondigitalocean.com
      port: 25060
