global:
  environment: production
  imagePullSecrets:
    - regcred
  databaseSecretName: cegarza-blog-secrets
  appImageTag: v1.0.36

fullnameOverride: cegarza-blog

blog:
  enabled: true
  replicas: 1
  selectorName: splattop-blog
  replaceOnSync: false
  strategy:
    type: Recreate
  image:
    repository: registry.digitalocean.com/sendouq/splattop-blog
    tag: v1.0.36
    digest: sha256:e2da2ee66648b13d39c5e463e502f7b230558a5e8746e831ba91469f45432c51
    pullPolicy: IfNotPresent
  secretKeys:
    - DATABASE_URL
    - DJANGO_SECRET_KEY
  env:
    DJANGO_SETTINGS_MODULE: splattopblog.settings
    DEBUG: "false"
    ALLOWED_HOSTS: dev.cegarza.com
    CSRF_TRUSTED_ORIGINS: https://dev.cegarza.com
    SECURE_HSTS_SECONDS: "31536000"
    SECURE_HSTS_INCLUDE_SUBDOMAINS: "false"
    SECURE_HSTS_PRELOAD: "false"
    SERVE_MEDIA: "true"
    USE_SPACES: "false"
    SITE_NAME: Bringing Down The Gauss
    SITE_DESCRIPTION: Thoughts, stories and ideas.
    SITE_AUTHOR: Cesar Garza
    WAGTAILADMIN_BASE_URL: https://dev.cegarza.com/admin/
    ALLOWED_EMBED_HOSTS: cesaregarza.github.io
    CSP_ENFORCE: "true"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    enabled: true
    existingClaim: ""
    accessMode: ReadWriteOnce
    size: 5Gi
    storageClass: do-block-storage
    retainOnDelete: true
  health:
    enabled: true
    path: /health/
    port: 8000
    hostHeader: dev.cegarza.com
  migrations:
    enabled: true
    hook: pre-install,pre-upgrade
    backoffLimit: 3
  databaseTLS:
    enabled: true
    secretName: cegarza-blog-secrets
    secretKey: DB_CA_CERT
    caMountPath: /etc/database-ca
    caFileName: ca.crt

ingress:
  enabled: true
  className: nginx
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
    external-dns.alpha.kubernetes.io/ttl: "60"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: dev.cegarza.com
      paths:
        - path: /
          pathType: Prefix
          servicePort: 8000
  tls:
    enabled: true
    secretName: cegarza-dev-tls
    certificate:
      enabled: true
      dnsNames:
        - dev.cegarza.com

networkPolicy:
  enabled: true
  selectorNames:
    - splattop-blog
    - cegarza-blog
  ingress:
    namespace: ingress-nginx
    podLabels:
      app.kubernetes.io/name: ingress-nginx
      app.kubernetes.io/instance: nginx-ingress
    port: 8000
  egress:
    dns:
      namespace: kube-system
      podLabels:
        k8s-app: kube-dns
    database:
      host: private-db-postgresql-nyc3-xscraper-do-user-15543770-0.c.db.ondigitalocean.com
      port: 25060
