worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
  include /etc/nginx/mime.types;
  default_type text/html;
  access_log off;
  server_tokens off;
  sendfile on;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  server {
    listen 8080;
    charset utf-8;
    root /usr/share/nginx/html;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    location = /healthz { default_type text/plain; return 200 "ok\n"; }
    location = /favicon.ico { try_files /favicon.ico =404; }
    location ~ ^/(api|ws|\.well-known)(/|$) {
      default_type text/plain;
      return 410 "splat.top has closed. Thank you for your interest and support.\n";
    }
    location / { try_files /index.html =404; }
  }
}
