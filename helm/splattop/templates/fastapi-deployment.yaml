{{- if .Values.fastapi.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "splattop.fullname" . }}-fastapi
  labels:
    {{- include "splattop.componentLabels" (dict "component" "fastapi" "root" .) | nindent 4 }}
spec:
  replicas: {{ .Values.fastapi.replicas }}
  {{- with .Values.fastapi.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.fastapi.minReadySeconds }}
  minReadySeconds: {{ . }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "splattop.componentSelectorLabels" (dict "component" "fastapi" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "splattop.componentSelectorLabels" (dict "component" "fastapi" "root" .) | nindent 8 }}
    spec:
      {{- include "splattop.imagePullSecrets" . | nindent 6 }}
      {{- with .Values.fastapi.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.fastapi.spreadAcrossNodes }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              {{- include "splattop.componentSelectorLabels" (dict "component" "fastapi" "root" .) | nindent 14 }}
      {{- end }}
      containers:
        - name: fastapi
          image: "{{ .Values.fastapi.image.repository }}:{{ include "splattop.imageTag" (dict "component" "fastapi" "root" .) }}"
          imagePullPolicy: {{ .Values.fastapi.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
            - name: websocket
              containerPort: 8001
              protocol: TCP
            - name: metrics
              containerPort: 5000
              protocol: TCP
          env:
            - name: ENV
              value: {{ .Values.global.environment | quote }}
            {{- range $key := .Values.fastapi.secretKeys }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "splattop.databaseSecretName" $ }}
                  key: {{ $key }}
            {{- end }}
            {{- range $env := .Values.fastapi.extraSecretEnv }}
            - name: {{ $env.name }}
              valueFrom:
                secretKeyRef:
                  name: {{ $env.secretName }}
                  key: {{ $env.key }}
            {{- end }}
            {{- range $key, $value := .Values.fastapi.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- if .Values.fastapi.resources }}
          resources:
            {{- toYaml .Values.fastapi.resources | nindent 12 }}
          {{- end }}
          {{- if .Values.fastapi.livenessProbe }}
          livenessProbe:
            {{- toYaml .Values.fastapi.livenessProbe | nindent 12 }}
          {{- end }}
          {{- if .Values.fastapi.readinessProbe }}
          readinessProbe:
            {{- toYaml .Values.fastapi.readinessProbe | nindent 12 }}
          {{- end }}
{{- end }}
