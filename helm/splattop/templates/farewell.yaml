{{- if .Values.farewell.enabled }}
{{- if or .Values.fastapi.enabled .Values.react.enabled .Values.celeryWorker.enabled .Values.celeryBeat.enabled .Values.redis.enabled .Values.splatnlp.enabled .Values.warmupJob.enabled }}
{{- fail "farewell.enabled requires all legacy application components and warmupJob to be disabled" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "splattop.fullname" . }}-farewell
  labels:
    {{- include "splattop.componentLabels" (dict "component" "farewell" "root" .) | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
data:
  index.html: |
    {{- .Files.Get "files/farewell/index.html" | nindent 4 }}
  nginx.conf: |
    {{- .Files.Get "files/farewell/nginx.conf" | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "splattop.fullname" . }}-farewell
  labels:
    {{- include "splattop.componentLabels" (dict "component" "farewell" "root" .) | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "splattop.componentSelectorLabels" (dict "component" "farewell" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "splattop.componentSelectorLabels" (dict "component" "farewell" "root" .) | nindent 8 }}
      annotations:
        checksum/content: {{ printf "%s%s" (.Files.Get "files/farewell/index.html") (.Files.Get "files/farewell/nginx.conf") | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: farewell
          image: "{{ .Values.farewell.image.repository }}:{{ .Values.farewell.image.tag }}@{{ .Values.farewell.image.digest }}"
          imagePullPolicy: IfNotPresent
          command: ["nginx", "-g", "daemon off;"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          resources:
            {{- toYaml .Values.farewell.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: content
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: content
          configMap:
            name: {{ include "splattop.fullname" . }}-farewell
            items:
              - key: index.html
                path: index.html
              - key: nginx.conf
                path: nginx.conf
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "splattop.fullname" . }}-farewell
  labels:
    {{- include "splattop.componentLabels" (dict "component" "farewell" "root" .) | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    {{- include "splattop.componentSelectorLabels" (dict "component" "farewell" "root" .) | nindent 4 }}
{{- end }}
