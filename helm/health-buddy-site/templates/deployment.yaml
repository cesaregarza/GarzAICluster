apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "health-buddy-site.fullname" . }}
  labels:
    {{- include "health-buddy-site.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "health-buddy-site.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "health-buddy-site.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: nginx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Substitute the pod's nameserver into the server block, then run nginx.
          command:
            - /bin/sh
            - -c
            - >-
              RESOLVER="$(awk '/^nameserver/ {print $2; exit}' /etc/resolv.conf)" &&
              sed "s/__RESOLVER__/$RESOLVER/" /etc/nginx/templates/default.conf.template
              > /etc/nginx/conf.d/default.conf &&
              exec nginx -g 'daemon off;'
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/templates/default.conf.template
              subPath: default.conf.template
            - name: config
              mountPath: /etc/nginx/hb-proxy.conf
              subPath: hb-proxy.conf
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "health-buddy-site.fullname" . }}
