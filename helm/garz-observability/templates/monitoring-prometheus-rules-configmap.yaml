{{- if and .Values.monitoring.prometheus.enabled .Values.monitoring.prometheus.rules.enabled }}
{{- $fullName := include "garzObservability.fullname" . -}}
{{- $rulesConfigMapName := default (printf "%s-prometheus-rules" $fullName) .Values.monitoring.prometheus.rules.configMapName -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $rulesConfigMapName }}
  namespace: {{ include "garzObservability.monitoringNamespace" . }}
  labels:
    {{- include "garzObservability.componentLabels" (dict "component" "prometheus-rules" "root" .) | nindent 4 }}
data:
  critical-alerts.yaml: |
    groups:
      - name: splattop-critical
        rules:
          - alert: FastAPIDown
            expr: sum(up{job="fastapi"}) == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: FastAPI service is unreachable
              description: Prometheus cannot scrape the FastAPI endpoints for 5 minutes.

          - alert: FastAPIFiveHundreds
            expr: |
              sum(rate(fastapi_requests_total{status=~"5.."}[5m]))
                /
              sum(rate(fastapi_requests_total[5m])) > 0.05
                and sum(rate(fastapi_requests_total[5m])) >= 1
            for: 10m
            labels:
              severity: critical
            annotations:
              summary: Elevated 5xx error rate detected on FastAPI
              description: More than 5% of requests have failed with 5xx responses over the last 10 minutes.

          - alert: FastAPIHighLatencyP95
            expr: |
              histogram_quantile(0.95, sum by (le) (rate(fastapi_request_duration_seconds_bucket[5m]))) > 1
                and sum(rate(fastapi_requests_total[5m])) > 0.1
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: FastAPI P95 latency above 1s
              description: 95th percentile request latency is above 1 second for 10 minutes.

          - alert: LookupSQLiteSnapshotStale
            expr: |
              time() - max(lookup_sqlite_snapshot_last_success_timestamp_seconds{kind="build"}) > 2700
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: Lookup SQLite snapshot is stale
              description: The lookup snapshot has not published a successful build for at least 45 minutes, so search and lookup-backed endpoints may drift stale.

          - alert: CompetitionPlayerSummaryLatencyHigh
            expr: |
              histogram_quantile(
                0.95,
                sum by (le) (
                  rate(
                    fastapi_request_duration_seconds_bucket{
                      path="/api/ripple/public/player/{player_id}/summary"
                    }[5m]
                  )
                )
              ) > 0.75
                and sum(
                  rate(
                    fastapi_requests_total{
                      path="/api/ripple/public/player/{player_id}/summary"
                    }[5m]
                  )
                ) > 0.05
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: Competition player summary latency is elevated
              description: The public competition player summary endpoint has sustained P95 latency above 750ms for 15 minutes.

          - alert: CeleryTaskFailures
            expr: |
              sum(rate(celery_task_failures_total[5m]))
                /
              clamp_min(sum(rate(celery_task_executions_total[5m])), 1) > 0.05
                and sum(rate(celery_task_executions_total[5m])) >= 0.5
            for: 10m
            labels:
              severity: critical
            annotations:
              summary: Celery task failures detected
              description: Failure rate exceeded 5% with at least 0.5 tasks/sec over the last 10 minutes.

          - alert: CeleryWorkersStuck
            expr: max(celery_tasks_in_progress) > 25
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: Celery workers stuck processing tasks
              description: Over 25 Celery tasks remained in-flight for more than 15 minutes.

          - alert: APIUsageQueueBacklog
            expr: max(api_usage_queue_length) > 100
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: API usage queue backlog
              description: api_usage_queue_length exceeded 100 items for 15 minutes; batch flusher may be stalled.

          - alert: PrometheusTSDBCapacityHigh
            expr: |
              max by (persistentvolumeclaim) (
                kubelet_volume_stats_used_bytes{namespace="monitoring", persistentvolumeclaim=~"prometheus-data.*"}
                  /
                kubelet_volume_stats_capacity_bytes{namespace="monitoring", persistentvolumeclaim=~"prometheus-data.*"}
              ) > 0.85
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: Prometheus TSDB nearing capacity
              description: PVC usage for Prometheus exceeded 85% for 15 minutes; consider scaling storage or reducing retention.

          - alert: KubernetesNodeCPURequestHeadroomLow
            expr: |
              (
                sum by (node) (
                  kube_pod_container_resource_requests{
                    job="kube-state-metrics",
                    node!="",
                    resource="cpu",
                    unit="core"
                  }
                    * on (namespace, pod) group_left()
                  max by (namespace, pod) (
                    kube_pod_status_phase{
                      job="kube-state-metrics",
                      phase="Running"
                    } == 1
                  )
                )
                  /
                max by (node) (
                  kube_node_status_allocatable{
                    job="kube-state-metrics",
                    resource="cpu",
                    unit="core"
                  }
                )
              ) > 0.85
            for: 10m
            labels:
              severity: warning
              service: kubernetes
            annotations:
              summary: Kubernetes node CPU request headroom is low
              description: Node {{ "{{ $labels.node }}" }} has reserved more than 85% of allocatable CPU for 10 minutes, leaving less than the Citrus rollout and scheduled-job headroom target.

          - alert: AlertmanagerDown
            expr: sum(up{job="alertmanager"}) == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: Alertmanager is unreachable
              description: Prometheus could not scrape the Alertmanager endpoints for 5 minutes.

          - alert: MandateSyntheticLiveVerifyFailed
            expr: |
              max by (namespace, owner_name) (
                kube_job_status_failed{namespace="agent-control-plane"}
                  * on (namespace, job_name) group_left(owner_name)
                    kube_job_owner{
                      namespace="agent-control-plane",
                      owner_kind="CronJob",
                      owner_name="agent-control-plane-synthetic-live-verify"
                    }
              ) > 0
            for: 2m
            labels:
              severity: critical
              service: mandate
            annotations:
              summary: Mandate synthetic live verify failed
              description: The scheduled Mandate synthetic live verify CronJob has a failed Job; inspect the agent-control-plane synthetic-live-verify logs before the next deploy.

          - alert: CitrusPodPending
            expr: |
              max by (namespace, pod) (
                kube_pod_status_phase{
                  job="kube-state-metrics",
                  namespace=~"default|citrus-dev",
                  pod=~"citrus(-dev)?-.*",
                  phase="Pending"
                } == 1
              ) > 0
            for: 1m
            labels:
              severity: warning
              service: citrus
            annotations:
              summary: Citrus pod is pending
              description: Pod {{ "{{ $labels.namespace }}" }}/{{ "{{ $labels.pod }}" }} has remained Pending for at least one minute; inspect scheduling events and CPU requests before retrying or rolling out more work.

          - alert: CitrusRecurringRuntimeHealthFailed
            expr: |
              max by (namespace, owner_name) (
                (
                  kube_job_status_failed{namespace=~"citrus(-dev)?"}
                    and on (namespace, job_name)
                      (time() - kube_job_status_start_time{namespace=~"citrus(-dev)?"} < 600)
                )
                  * on (namespace, job_name) group_left(owner_name)
                    kube_job_owner{
                      namespace=~"citrus(-dev)?",
                      owner_kind="CronJob",
                      owner_name=~"citrus(-dev)?-recurring-health"
                    }
              ) > 0
            for: 2m
            labels:
              severity: critical
              service: citrus
            annotations:
              summary: Citrus recurring runtime health failed
              description: The recurring health check detected overdue work, an unsafe claim, billing queue trouble, payment reconciliation lag, or a paid cycle missing its order.

          - alert: CitrusRecurringRuntimeTickFailed
            expr: |
              max by (namespace, owner_name) (
                (
                  kube_job_status_failed{namespace=~"citrus(-dev)?"}
                    and on (namespace, job_name)
                      (time() - kube_job_status_start_time{namespace=~"citrus(-dev)?"} < 600)
                )
                  * on (namespace, job_name) group_left(owner_name)
                    kube_job_owner{
                      namespace=~"citrus(-dev)?",
                      owner_kind="CronJob",
                      owner_name=~"citrus(-dev)?-recurring-tick"
                    }
              ) > 0
            for: 2m
            labels:
              severity: critical
              service: citrus
            annotations:
              summary: Citrus recurring runtime tick failed
              description: The five-minute recurring wake-up could not discover or publish its bounded outbox batch; inspect the exact Job logs before replaying any event.

          - alert: CitrusRecurringRuntimeExporterUnhealthy
            expr: citrus_recurring_runtime_health == 0
            for: 2m
            labels:
              severity: critical
              service: citrus
            annotations:
              summary: Citrus recurring runtime metrics report unhealthy
              description: One or more recurring runtime safety thresholds are failing; inspect the dimension-specific citrus_recurring gauges.

          - alert: CitrusRecurringRuntimeMetricsMissing
            expr: |
              kube_deployment_spec_replicas{
                namespace=~"citrus(-dev)?",
                deployment=~"citrus(-dev)?-billing-worker"
              } > 0
                unless on (namespace)
              max by (namespace) (
                up{
                  job="kubernetes-pods",
                  namespace=~"citrus(-dev)?",
                  pod=~"citrus(-dev)?-billing-worker-.*"
                } == 1
              )
            for: 2m
            labels:
              severity: critical
              service: citrus
            annotations:
              summary: Citrus recurring runtime metrics are missing
              description: The billing worker is expected, but Prometheus cannot scrape its recurring metrics sidecar.

          - alert: CitrusRecurringRuntimeWorkOverdue
            expr: citrus_recurring_overdue_due_work > 0
            for: 5m
            labels:
              severity: critical
              service: citrus
            annotations:
              summary: Citrus recurring work is overdue
              description: Persisted recurring work remains due beyond the configured scheduler grace window.

          - alert: CitrusRecurringRuntimeOutboxStale
            expr: citrus_recurring_oldest_outbox_age_seconds >= 900 or citrus_recurring_stale_claims > 0
            for: 5m
            labels:
              severity: critical
              service: citrus
            annotations:
              summary: Citrus recurring outbox is stale
              description: The billing outbox contains an old pending event or a stale publication claim.

          - alert: CitrusRecurringBillingQueueUnavailable
            expr: citrus_recurring_billing_queue_unavailable > 0 or citrus_recurring_billing_queue_depth >= 100
            for: 5m
            labels:
              severity: critical
              service: citrus
            annotations:
              summary: Citrus billing queue is unavailable or backed up
              description: The dedicated billing queue cannot be read or has exceeded its bounded depth threshold.

          - alert: CitrusRecurringNoticeFailures
            expr: citrus_recurring_recent_notice_failures > 0
            for: 2m
            labels:
              severity: critical
              service: citrus
            annotations:
              summary: Citrus recurring notice delivery needs review
              description: A notice failed or reached an unknown provider outcome within the configured alert window.

          - alert: CitrusRecurringConfirmationNeedsReview
            expr: citrus_recurring_confirmation_delivery_review_required > 0
            for: 2m
            labels:
              severity: critical
              service: citrus
            annotations:
              summary: Citrus recurring confirmation needs provider review
              description: An at-most-once action confirmation failed or has an unknown provider outcome and must never be blindly replayed.

          - alert: CitrusRecurringPaymentReconciliationLag
            expr: citrus_recurring_webhook_lagged_payments > 0
            for: 5m
            labels:
              severity: critical
              service: citrus
            annotations:
              summary: Citrus recurring payment reconciliation is lagging
              description: A processing or unknown payment has remained unresolved beyond the reconciliation threshold.

          - alert: CitrusRecurringChargeOrOrderStalled
            expr: citrus_recurring_unclaimed_charge_due > 0 or citrus_recurring_stale_paid_cycles_missing_orders > 0
            for: 5m
            labels:
              severity: critical
              service: citrus
            annotations:
              summary: Citrus recurring charge or order materialization is stalled
              description: A due charge remains unclaimed or a paid recurring cycle is still missing its generated order beyond the grace window.

          - alert: HermesGovernedRuntimeDown
            expr: |
              absent(up{job="hermes-governed-runtime"})
                or up{job="hermes-governed-runtime"} == 0
            for: 2m
            labels:
              severity: critical
              service: hermes
            annotations:
              summary: Hermes governed runtime is unreachable
              description: Prometheus cannot scrape the Hermes governed runtime on the nyc3 private endpoint.

          - alert: HermesGovernedRuntimeNotReady
            expr: |
              absent(hermes_governed_runtime_ready{job="hermes-governed-runtime"})
                or hermes_governed_runtime_ready{job="hermes-governed-runtime"} == 0
            for: 2m
            labels:
              severity: critical
              service: hermes
            annotations:
              summary: Hermes governed runtime readiness failed
              description: The Hermes runtime exporter is reachable, but the governed profile, provenance, operations, or observed runtime gate is not ready.

          - alert: HermesGovernedRuntimeCheckFailed
            expr: hermes_governed_runtime_check_ok{job="hermes-governed-runtime"} == 0
            for: 2m
            labels:
              severity: critical
              service: hermes
            annotations:
              summary: Hermes governed runtime check failed
              description: One of the Hermes governed-runtime checks is failing; inspect the check label and runtime evidence before continuing cutover.

          - alert: GrafanaDown
            expr: sum(up{job="grafana"}) == 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: Grafana is unreachable
              description: Grafana metrics endpoint has been unreachable for 5 minutes.
{{- end }}
