{{- $cfg := .Values.sentryDiscord -}}
{{- if $cfg.enabled }}
{{- if not (regexMatch "^sha256:[a-f0-9]{64}$" $cfg.image.digest) }}
{{- fail "sentryDiscord.image.digest must be an immutable sha256 digest" }}
{{- end }}
{{- $ns := include "garzObservability.monitoringNamespace" . -}}
{{- $org := required "sentryDiscord.organization is required" $cfg.organization -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: sentry-discord-alerts-script
  namespace: {{ $ns }}
data:
  sentry_discord.py: |
{{ .Files.Get "files/sentry_discord.py" | indent 4 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sentry-discord-alerts-state
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sentry-discord-alerts
  namespace: {{ $ns }}
spec:
  schedule: {{ $cfg.schedule | quote }}
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 150
      template:
        metadata:
          labels:
            app.kubernetes.io/component: sentry-discord-alerts
          annotations:
            checksum/script: {{ .Files.Get "files/sentry_discord.py" | sha256sum }}
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: poller
              image: "{{ $cfg.image.repository }}@{{ $cfg.image.digest }}"
              imagePullPolicy: IfNotPresent
              command: [python, -B, /app/sentry_discord.py]
              env:
                - name: SENTRY_ORG
                  value: {{ $org | quote }}
                - name: SENTRY_PROJECTS
                  value: {{ join "," $cfg.projects | quote }}
              resources:
                requests:
                  cpu: 20m
                  memory: 32Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: script
                  mountPath: /app
                  readOnly: true
                - name: secrets
                  mountPath: /secrets
                  readOnly: true
                - name: state
                  mountPath: /state
          volumes:
            - name: script
              configMap:
                name: sentry-discord-alerts-script
            - name: secrets
              secret:
                secretName: {{ $cfg.existingSecret }}
                defaultMode: 0440
            - name: state
              persistentVolumeClaim:
                claimName: sentry-discord-alerts-state
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: sentry-discord-alerts-egress
  namespace: {{ $ns }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: sentry-discord-alerts
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchName: sentry.io
        - matchName: discord.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
{{- end }}
