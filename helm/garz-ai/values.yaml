global:
  imagePullSecrets:
    - regcred

replicaCount: 1

image:
  repository: registry.digitalocean.com/sendouq/garz-ai
  tag: v0.1.8@sha256:a4f8c9abdaaae1a4a896eeac0087c1427d46ca32bf3d6f83773bfbd942b124c7
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: true
  className: traefik-nginx
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - garz.ai
    - justflip.garz.ai
    - habit-taper.garz.ai
    - justramp.garz.ai
  tls:
    enabled: true
    secretName: justflip-garz-ai-tls
    certificate:
      enabled: true
      issuerName: letsencrypt-prod
      dnsNames: []

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi
