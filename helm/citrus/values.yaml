global:
  imagePullSecrets:
    - regcred

replicaCount: 2

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

image:
  repository: registry.digitalocean.com/sendouq/citrus
  tag: ba37ac601385a8af4c2e445fa1062d17955426c9 # allow-latest
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

syncWaves:
  config: "0"
  migrations: "1"
  deployment: "2"

application:
  configMapName: django-config
  secretName: django-secrets
  emailSecretName: django-email-secrets
  spacesSecretName: django-spaces-secrets
  command: >-
    exec gunicorn Mycore.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120 --access-logfile -
  configData:
    DJANGO_DEBUG: "False"
    SITE_NAME: "Citrus Grace"
    DB_SCHEMA: "citrus"
    ALLOWED_HOSTS: "citrus-grace.com,www.citrus-grace.com"
    CSRF_TRUSTED_ORIGINS: "https://citrus-grace.com,https://www.citrus-grace.com"
    DEFAULT_FROM_EMAIL: "orders@citrus-grace.com"
    MEDIA_EMAIL: "media@citrus-grace.com"
    HELP_EMAIL: "help@citrus-grace.com"
    ORDERS_EMAIL: "orders@citrus-grace.com"
    BUSINESS_TIME_ZONE: "America/Chicago"
    CACHE_URL: "redis://citrus-redis:6379/0"
    RATELIMIT_USE_CACHE: "default"
    EMAIL_HOST: "smtp-relay.gmail.com"
    EMAIL_PORT: "587"
    EMAIL_USE_TLS: "True"
    EMAIL_USE_AUTH: "False"
    EMAIL_TIMEOUT: "10"
    AWS_STORAGE_BUCKET_NAME: "citrus-media"
    AWS_S3_ENDPOINT_URL: "https://nyc3.digitaloceanspaces.com"
    AWS_S3_REGION_NAME: "nyc3"
    AWS_S3_CUSTOM_DOMAIN: "citrus-media.nyc3.cdn.digitaloceanspaces.com"
    AWS_QUERYSTRING_AUTH: "False"
    AWS_DEFAULT_ACL: "public-read"
    AWS_S3_CACHE_CONTROL: "max-age=86400, public"


service:
  name: citrus-service
  type: ClusterIP
  port: 80
  targetPort: 8000

persistence:
  enabled: false
  mountEnabled: false
  name: django-media-pvc
  storageClassName: ""
  size: 10Gi
  accessModes:
    - ReadWriteOnce
  mountPath: /citrus/media

migrations:
  enabled: true
  backoffLimit: 3
  command:
    - python
    - manage.py
    - migrate
    - --noinput

terminationGracePeriodSeconds: 60

podSecurityContext:
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  runAsGroup: 10001
  runAsNonRoot: true
  runAsUser: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  runAsGroup: 10001
  runAsNonRoot: true
  runAsUser: 10001
  capabilities:
    drop:
      - ALL

redis:
  enabled: true
  name: citrus-redis
  replicas: 1
  image:
    repository: redis
    tag: "7.2.4-alpine"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 6379
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

ingress:
  enabled: true
  name: citrus-ingress
  className: ""
  annotations:
    external-dns.alpha.kubernetes.io/controller: "manual"
    kubernetes.io/ingress.class: "legacy-nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    acme.cert-manager.io/http01-edit-in-place: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - citrus-grace.com
    - www.citrus-grace.com
  tls:
    enabled: true
    secretName: citrus-grace-tls

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 1Gi
