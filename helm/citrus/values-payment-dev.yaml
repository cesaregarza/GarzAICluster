# CES-844 dev activation overlay. The dedicated Secret supplies only test-mode
# API and publishable settings. The exact existing dev webhook key remains in
# django-secrets and is selected individually; the broad Secret is not imported.
paymentCredentials:
  enabled: true
  secretName: citrus-dev-payment-credentials
  owner: citrus-dev
  rolloutRevision: citrus-sandbox-credentials-2026-09-12
  webhookEnvironmentVariable: STRIPE_WEBHOOK_SECRET_DEV
  webhookSecretName: django-secrets
  webhookSecretKey: STRIPE_WEBHOOK_SECRET_DEV

# CES-807 phase 1: materialize the provider-isolated sweep only in a suspended
# state. Keep this receipt equal to values-dev.yaml image.tag until the separate
# reviewed unsuspend gate has completed.
directOrderPaymentSweep:
  enabled: true
  suspend: false
  runtimeSecretName: citrus-dev-sweep-runtime
  verifiedImageTag: 1a93dbcd8da9fa5f31daf5e9c5958e5f4c628a6f
  offSessionMode: legacy

# Normal browser checkout uses the isolated Stripe sandbox. This overlay follows
# the compatible source rollout and exact-image smoke; values-dev stays deny
# as the fallback. Roll back these settings before reverting the source image.
paymentSafety:
  networkMode: sandbox
  policy:
    revision: citrus-dev-sandbox-v1

# Capture test messages privately inside the container, outside served media.
# No SMTP delivery; inspect only owned QA messages and remove them after QA.
application:
  configData:
    EMAIL_BACKEND: "django.core.mail.backends.filebased.EmailBackend"
    EMAIL_FILE_PATH: "/tmp/citrus-dev-email"
