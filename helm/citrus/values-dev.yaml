image:
  tag: 90b90a00931f48a8eef9c8c2303ead5f2c9db7ce # allow-latest

# Activate the CES-845 development deny boundary before retrying the guarded
# source image. The current rollback image remains pinned for this first phase.
paymentSafety:
  enabled: true
  environment: development
  owner: citrus-dev
  networkMode: deny
  policy:
    required: true
    provider: cilium
    revision: ces-845-dev-v1
  networkPolicy:
    enabled: true
    syncWave: "-1"
    database:
      host: "private-db-postgresql-nyc3-xscraper-do-user-15543770-0.c.db.ondigitalocean.com"
      port: 25060
    additionalExternalEgress: []

# CES-883 stage 1 is an operator-only test-mode smoke. The scheduled object is
# inert until a separately acknowledged GitOps change flips this flag, and the
# template itself is permanently suspended for one-shot `kubectl create job
# --from=cronjob/...` use only.
stripeSmokeRunner:
  enabled: false
  suspend: true
  policyRevision: ces-883-stripe-smoke-v1
  # Non-secret provider identity attestation. The separately acknowledged
  # enable change must bind the exact Stripe test account before rendering.
  expectedAccountId: ""
  activeDeadlineSeconds: 900
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 0

application:
  # Standalone generated-secret file (KSOPS: secrets/citrus-dev/django-app-key.enc.yaml)
  # holding a real DJANGO_SECRET_KEY, encrypted with the public age recipient only.
  generatedSecretName: citrus-dev-app-key
  rolloutOnConfigChange: true
  configData:
    DJANGO_DEBUG: "False"
    SITE_NAME: "Citrus Grace Dev"
    DB_SCHEMA: "citrus"
    ALLOWED_HOSTS: "dev.citrus-grace.com"
    CSRF_TRUSTED_ORIGINS: "https://dev.citrus-grace.com"
    DEFAULT_FROM_EMAIL: "orders@citrus-grace.com"
    MEDIA_EMAIL: "media@citrus-grace.com"
    HELP_EMAIL: "help@citrus-grace.com"
    ORDERS_EMAIL: "orders@citrus-grace.com"
    BUSINESS_TIME_ZONE: "America/Chicago"
    # Never deliver mail from dev. Synthetic customers intentionally use
    # reserved domains and must not generate bounces in real shared inboxes.
    EMAIL_BACKEND: "django.core.mail.backends.dummy.EmailBackend"
    EMAIL_HOST: "smtp-relay.gmail.com"
    EMAIL_PORT: "587"
    EMAIL_USE_TLS: "True"
    EMAIL_USE_AUTH: "False"
    EMAIL_TIMEOUT: "10"
    AWS_STORAGE_BUCKET_NAME: "citrus-media-dev"
    AWS_S3_CUSTOM_DOMAIN: "citrus-media-dev.nyc3.cdn.digitaloceanspaces.com"

worker:
  enabled: true
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0

billingWorker:
  enabled: false

recurringRuntime:
  enabled: false
  expectedSourceRevision: 90b90a00931f48a8eef9c8c2303ead5f2c9db7ce

# Dev has no approved least-privilege runtime Secret or compatible corrected
# image. Keep every activation input empty until the prerequisite train lands.
smsReconciliation:
  enabled: false
  suspend: true
  secretName: ""
  verifiedImageTag: ""
  commandCompatibleImageTags: []
  networkPolicy:
    enabled: false
    provider: ""
    revision: ""
    database:
      host: ""

mediaRequeue:
  enabled: true

mediaGc:
  enabled: true

ingress:
  hosts:
    - dev.citrus-grace.com
  tls:
    enabled: true
    secretName: citrus-dev-grace-tls
