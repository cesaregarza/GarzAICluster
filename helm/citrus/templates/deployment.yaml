{{- include "citrus.paymentCredentials.validate" . }}
{{- include "citrus.paymentSafety.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "citrus.fullname" . }}
  labels:
    {{- include "citrus.labels" . | nindent 4 }}
    app: citrus-web
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.syncWaves.deployment | quote }}
spec:
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: citrus-web
  template:
    metadata:
      labels:
        app: citrus-web
        {{- if .Values.paymentSafety.enabled }}
        {{- include "citrus.paymentSafety.podLabel" . | nindent 8 }}
        {{- end }}
      {{- if or .Values.application.rolloutOnConfigChange .Values.paymentCredentials.enabled }}
      annotations:
        {{- if .Values.application.rolloutOnConfigChange }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum | quote }}
        {{- end }}
        {{- if .Values.paymentCredentials.enabled }}
        citrus.grace/payment-rollout-revision: {{ .Values.paymentCredentials.rolloutRevision | quote }}
        {{- end }}
      {{- end }}
    spec:
      {{- include "citrus.imagePullSecrets" . | nindent 6 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: django
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default (printf "v%s" .Chart.AppVersion) }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          command: ["sh", "-c"]
          args:
            - {{ .Values.application.command | quote }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          {{- if or .Values.paymentCredentials.enabled .Values.paymentSafety.enabled }}
          env:
            {{- include "citrus.paymentSafety.env" . | nindent 12 }}
            {{- include "citrus.paymentCredentials.webEnv" . | nindent 12 }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ .Values.application.configMapName }}
            - secretRef:
                name: {{ .Values.application.secretName }}
                optional: true
            {{- if .Values.application.emailSecretName }}
            - secretRef:
                name: {{ .Values.application.emailSecretName }}
                optional: true
            {{- end }}
            {{- if .Values.application.spacesSecretName }}
            - secretRef:
                name: {{ .Values.application.spacesSecretName }}
                optional: true
            {{- end }}
            {{- if .Values.application.generatedSecretName }}
            # Generated app secrets (e.g. DJANGO_SECRET_KEY); listed last so it
            # overrides any placeholder of the same key in secretName.
            - secretRef:
                name: {{ .Values.application.generatedSecretName }}
                optional: true
            {{- end }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
          {{- if and .Values.persistence.enabled .Values.persistence.mountEnabled }}
          volumeMounts:
            - name: media-volume
              mountPath: {{ .Values.persistence.mountPath }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if and .Values.persistence.enabled .Values.persistence.mountEnabled }}
      volumes:
        - name: media-volume
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.name }}
      {{- end }}
