{{- if .Values.redis.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.redis.name }}
  labels:
    {{- include "citrus.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  replicas: {{ .Values.redis.replicas }}
  {{- if .Values.redis.persistence.enabled }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "citrus.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        {{- include "citrus.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: redis
    spec:
      {{- with .Values.redis.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        {{- if .Values.redis.persistence.enabled }}
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        {{- end }}
      containers:
        - name: redis
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          # requirepass goes through a 0600 file so the password never appears
          # in the process command line; REDISCLI_AUTH authenticates probes.
          command: ["sh", "-c"]
          args:
            - >-
              umask 077 &&
              printf 'requirepass %s\n' "$REDIS_PASSWORD" > /tmp/redis-auth.conf &&
              exec redis-server /tmp/redis-auth.conf
              --maxmemory 200mb --maxmemory-policy volatile-lru
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "redis requires application.generatedSecretName" .Values.application.generatedSecretName }}
                  key: REDIS_PASSWORD
                  optional: false
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.application.generatedSecretName }}
                  key: REDIS_PASSWORD
                  optional: false
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          livenessProbe:
            exec:
              # redis-cli exits 0 on NOAUTH/WRONGPASS, so require a real PONG.
              command: ["/bin/sh", "-ec", 'test "$(redis-cli --raw ping)" = PONG']
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            exec:
              # redis-cli exits 0 on NOAUTH/WRONGPASS, so require a real PONG.
              command: ["/bin/sh", "-ec", 'test "$(redis-cli --raw ping)" = PONG']
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 999
            capabilities:
              drop:
                - ALL
          {{- if .Values.redis.persistence.enabled }}
          volumeMounts:
            - name: redis-data
              mountPath: /data
          {{- end }}
      {{- if .Values.redis.persistence.enabled }}
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: {{ .Values.redis.persistence.name }}
      {{- end }}
{{- end }}
