{{- if eq .Values.opencodeArtifactHandoff.mode "governedCore" }}
{{- $workers := list
      (dict "values" .Values.opencodeProposer "identityLabel" "opencodeProposer.identity")
      (dict "values" .Values.opencodeApplyExecutor "identityLabel" "opencodeApplyExecutor.identity")
-}}
{{- range $worker := $workers }}
{{- $identity := $worker.values.identity }}
{{- if $identity.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agent-workloads.opencodeIdentityServiceAccountName" (dict "root" $ "identity" $identity "identityLabel" $worker.identityLabel) }}
  labels:
    {{- include "agent-workloads.labels" $ | nindent 4 }}
    app.kubernetes.io/component: opencode-release-identity
    mandate.cesaregarza.io/worker-id: {{ $identity.workerId | quote }}
  {{- with $identity.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- with $identity.previousRelease }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agent-workloads.previousOpencodeIdentityServiceAccountName" (dict "root" $ "identity" $identity "identityLabel" $worker.identityLabel) }}
  labels:
    {{- include "agent-workloads.labels" $ | nindent 4 }}
    app.kubernetes.io/component: opencode-release-identity-previous
    mandate.cesaregarza.io/worker-id: {{ $identity.workerId | quote }}
  {{- with $identity.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
{{- end }}
{{- end }}
