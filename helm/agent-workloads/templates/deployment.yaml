{{- range $workerId, $worker := .Values.workers }}
{{- if $worker.enabled }}
{{- $ctx := dict "root" $ "worker" $worker "workerId" $workerId }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent-workloads.workerMetadataName" $ctx }}
  labels:
    {{- include "agent-workloads.workerLabels" $ctx | nindent 4 }}
spec:
  replicas: {{ $worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "agent-workloads.workerSelectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agent-workloads.workerSelectorLabels" $ctx | nindent 8 }}
        {{- with $worker.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum.garz.ai/agent-workloads-release-pins: {{ include "agent-workloads.releasePinsChecksum" $ | quote }}
        {{- with $worker.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      serviceAccountName: {{ include "agent-workloads.workerCurrentServiceAccountName" $ctx }}
      {{- if $worker.enableServiceLinksField }}
      enableServiceLinks: {{ $worker.enableServiceLinks }}
      {{- end }}
      {{- include "agent-workloads.imagePullSecrets" $ | nindent 6 }}
      securityContext:
        {{- toYaml $worker.podSecurityContext | nindent 8 }}
      {{- with $worker.initWorkspace }}
      {{- if .enabled }}
      initContainers:
        - name: {{ .name }}
          image: "{{ include "agent-workloads.imageRef" $worker.image }}"
          imagePullPolicy: {{ $worker.image.pullPolicy }}
          command:
            {{- toYaml .command | nindent 12 }}
          {{- if .args }}
          args:
            {{- toYaml .args | nindent 12 }}
          {{- else if .script }}
          args:
            - {{ .script | quote }}
          {{- end }}
          {{- with .env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml (default $worker.resources .resources) | nindent 12 }}
          securityContext:
            {{- toYaml (default $worker.securityContext .securityContext) | nindent 12 }}
          volumeMounts:
            {{- toYaml .volumeMounts | nindent 12 }}
            {{- if and $.Values.workspaceSeedBundle.base64 $worker.workspace.seedBundle }}
            - name: seed-bundle
              mountPath: /seed-bundle
              readOnly: true
            {{- end }}
      {{- end }}
      {{- end }}
      containers:
        - name: {{ $worker.containerName }}
          image: "{{ include "agent-workloads.imageRef" $worker.image }}"
          imagePullPolicy: {{ $worker.image.pullPolicy }}
          command:
            {{- toYaml $worker.command | nindent 12 }}
          {{- with $worker.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            {{- include "agent-workloads.envFromWorker" $ctx | nindent 12 }}
            {{- with $worker.handoffMode }}
            - name: AGENT_WORKLOADS_OPENCODE_ARTIFACT_HANDOFF_MODE
              value: {{ . | quote }}
            {{- end }}
            - name: MANDATE_WORKLOAD_IDENTITY_TOKEN_FILE
              value: {{ include "agent-workloads.workerTokenPath" $ctx | quote }}
          resources:
            {{- toYaml $worker.resources | nindent 12 }}
          securityContext:
            {{- toYaml $worker.securityContext | nindent 12 }}
          volumeMounts:
            {{- toYaml $worker.volumeMounts | nindent 12 }}
            - name: projected-workload-identity-token
              mountPath: {{ $worker.identity.token.mountPath | quote }}
              readOnly: true
      volumes:
        {{- toYaml $worker.volumes | nindent 8 }}
        - name: projected-workload-identity-token
          projected:
            # Decimal 288 is octal 0440; decimal avoids YAML 1.1/1.2 ambiguity.
            defaultMode: 288
            sources:
              - serviceAccountToken:
                  audience: {{ $worker.identity.token.audience | quote }}
                  expirationSeconds: {{ int $worker.identity.token.expirationSeconds }}
                  path: {{ $worker.identity.token.fileName | quote }}
        {{- if and $.Values.workspaceSeedBundle.base64 $worker.workspace.seedBundle }}
        - name: seed-bundle
          configMap:
            name: {{ $worker.workspace.seedConfigMapName }}
        {{- end }}
{{- end }}
{{- end }}
