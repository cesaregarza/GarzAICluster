{{- range $workerId, $worker := .Values.workers }}
{{- if and $worker.enabled $worker.networkPolicy.enabled }}
{{- $ctx := dict "root" $ "worker" $worker "workerId" $workerId }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agent-workloads.workerMetadataName" $ctx }}
  labels:
    {{- include "agent-workloads.workerLabels" $ctx | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agent-workloads.workerSelectorLabels" $ctx | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    {{- if $worker.networkPolicy.egress.dns.enabled }}
    - to:
        {{- toYaml $worker.networkPolicy.egress.dns.destinations | nindent 8 }}
      ports:
        {{- toYaml $worker.networkPolicy.egress.dns.ports | nindent 8 }}
    {{- end }}
    {{- range $destination := $worker.networkPolicy.egress.destinations }}
    - to:
        {{- list (omit $destination "ports") | toYaml | nindent 8 }}
      {{- with $destination.ports }}
      ports:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
{{- end }}
{{- end }}
