{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agent-workloads.serviceAccountName" . }}
  labels:
    helm.sh/chart: {{ include "agent-workloads.chart" . }}
    app.kubernetes.io/name: {{ include "agent-workloads.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
{{- range $workerId, $worker := .Values.workers }}
{{- if and $worker.enabled $worker.identity.serviceAccount.create }}
{{- $ctx := dict "root" $ "worker" $worker "workerId" $workerId }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agent-workloads.workerCurrentServiceAccountName" $ctx }}
  labels:
    helm.sh/chart: {{ include "agent-workloads.chart" $ }}
    app.kubernetes.io/name: {{ include "agent-workloads.name" $ }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    app.kubernetes.io/component: {{ default "projected-workload-identity" $worker.identity.serviceAccount.component }}
    mandate.cesaregarza.io/worker-id: {{ $workerId | quote }}
  {{- with $worker.identity.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- with $worker.identity.previousRelease }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agent-workloads.workerPreviousServiceAccountName" $ctx }}
  labels:
    helm.sh/chart: {{ include "agent-workloads.chart" $ }}
    app.kubernetes.io/name: {{ include "agent-workloads.name" $ }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    app.kubernetes.io/component: {{ default "projected-workload-identity-previous" $worker.identity.serviceAccount.previousComponent }}
    mandate.cesaregarza.io/worker-id: {{ $workerId | quote }}
  {{- with $worker.identity.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
{{- end }}
