{{- if .Values.workspaceSeedBundle.base64 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.workspaceSeedBundle.name }}
  labels:
    helm.sh/chart: {{ include "agent-workloads.chart" . }}
    app.kubernetes.io/name: {{ default (include "agent-workloads.name" .) .Values.workspaceSeedBundle.appName }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: {{ include "agent-workloads.name" . }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: opencode-proposer
    {{- with .Values.workspaceSeedBundle.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
binaryData:
  sandbox.bundle: {{ .Values.workspaceSeedBundle.base64 }}
{{- end }}
