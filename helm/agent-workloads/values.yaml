global:
  imagePullSecrets: []
  runtimeSecretName: agent-workloads-secrets

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  automountServiceAccountToken: false
  annotations: {}

rolloutChecksums:
  workloadIdentityTokenSecret: ""

workspaceSeedBundle:
  base64: ""
  name: agent-workloads-seed-bundle
  appName: agent-workloads
  labels: {}

# Every enabled worker is projected and is keyed by its canonical worker id.
# Production overlays provide the complete worker map and immutable release
# pins; this disabled example keeps a bare chart install renderable.
workers:
  data.workspace_probe:
    enabled: false
    replicaCount: 1
    metadataName: agent-workloads
    labels: {}
    selectorLabels:
      app.kubernetes.io/name: agent-workloads
      app.kubernetes.io/instance: agent-workloads
    podAnnotations: {}
    podLabels: {}
    enableServiceLinks: false
    containerName: worker
    image:
      repository: registry.digitalocean.com/sendouq/agent-workloads-worker
      tag: dev
      digest: ""
      pullPolicy: IfNotPresent
    identity:
      workerId: data.workspace_probe
      mode: projected
      serviceAccountNamePrefix: agent-workloads
      serviceAccount:
        create: true
        component: projected-workload-identity
        previousComponent: projected-workload-identity-previous
        annotations: {}
      token:
        audience: mandate-api
        expirationSeconds: 3600
        mountPath: /var/run/mandate/workload-identity
        fileName: token
      previousRelease: null
    command:
      - agent-workloads-worker
    args: []
    secretKeys: []
    secretEnv: {}
    env: {}
    handoffMode: ""
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      fsGroup: 65532
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      capabilities:
        drop:
          - ALL
    resources:
      requests:
        cpu: 25m
        memory: 96Mi
      limits:
        cpu: 250m
        memory: 256Mi
    initWorkspace:
      enabled: false
      name: init-workspace
      command: []
      script: ""
      args: []
      env: []
      volumeMounts: []
    volumes:
      - name: tmp
        emptyDir: {}
    volumeMounts:
      - name: tmp
        mountPath: /tmp
    networkPolicy:
      enabled: false
      egress:
        dns:
          enabled: false
          destinations: []
          ports:
            - port: 53
              protocol: UDP
            - port: 53
              protocol: TCP
        destinations: []
    workspace:
      seedBundle: false
      seedConfigMapName: ""

mandateReleasePins: {}
