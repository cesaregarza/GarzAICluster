global:
  imagePullSecrets:
    - regcred
  runtimeSecretName: agent-control-plane-secrets

nameOverride: agent-control-plane
fullnameOverride: agent-control-plane

replicaCount: 1

apiPodAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"
  prometheus.io/path: /metrics

metrics:
  enabled: true
  port: 9090

image:
  repository: registry.digitalocean.com/sendouq/agent-platform
  tag: sha-33546e5db1b0
  pullPolicy: IfNotPresent

secretKeys:
  - AGENT_PLATFORM_DATABASE_URL
  - AGENT_PLATFORM_OPENCLAW_TOKEN
  - AGENT_PLATFORM_TRUSTED_EDGE_TOKEN
  - AGENT_PLATFORM_INTERNAL_WORKER_TOKEN
  - AGENT_PLATFORM_WORKER_SERVICE_TOKEN
  - AGENT_PLATFORM_APPROVAL_TOKEN
  - AGENT_PLATFORM_AUDIT_READ_TOKEN
  - AGENT_PLATFORM_AUDIT_WRITE_TOKEN
  - AGENT_PLATFORM_READONLY_SQL_DATABASE_URL
  - AGENT_PLATFORM_READONLY_SQL_ANALYTICAL_DATABASE_URL
  - AGENT_PLATFORM_MODEL_GATEWAY_TOKEN_SECRET
  - AGENT_PLATFORM_MODEL_GATEWAY_CODEX_AUTH_JSON
  - AGENT_PLATFORM_WORKLOAD_IDENTITY_HMAC_SECRET
  - AGENT_PLATFORM_MCP_TRUSTED_CONTEXT_HMAC_SECRET

apiExtraSecretRefs:
  - secretName: agent-control-plane-hermes-mctx
    keys:
      - AGENT_PLATFORM_MCP_TRUSTED_CONTEXT_HMAC_SECONDARY_SECRET

env:
  AGENT_PLATFORM_ENVIRONMENT: prod
  AGENT_PLATFORM_PROVIDER_DIGEST_PINS_JSON: '{"model_gateway":{"digest":"sha256:a1bca8321b19f748de5b56ecfeb02081f7be44f2d362b00f79043db56805835e","protocol":"model_gateway"},"readonly-sql-broker":{"digest":"sha256:6cdbd880eb2e8912359878e903b9c98ff415d7045d9a4feb159a1919640827de","protocol":"readonly_sql"}}'
  AGENT_PLATFORM_OUTPUT_GATE_BACKEND: patch_aware
  AGENT_PLATFORM_POSTGRES_POOL_MIN_SIZE: "0"
  AGENT_PLATFORM_POSTGRES_POOL_MAX_SIZE: "2"
  AGENT_PLATFORM_READONLY_SQL_POOL_MIN_SIZE: "0"
  AGENT_PLATFORM_READONLY_SQL_POOL_MAX_SIZE: "1"
  AGENT_PLATFORM_MODEL_GATEWAY_BACKEND: codex_chatgpt_responses
  AGENT_PLATFORM_MODEL_GATEWAY_TIMEOUT_SECONDS: "90"
  AGENT_PLATFORM_MODEL_GATEWAY_KILL_SWITCH_FILE: /app/model-gateway-controls/kill-switch
  AGENT_PLATFORM_MODEL_GATEWAY_REVOCATION_FILE: /app/model-gateway-controls/revocations.txt
  AGENT_PLATFORM_WORKLOAD_IDENTITY_MODE: hmac
  AGENT_PLATFORM_WORKLOAD_IDENTITY_ISSUER: kubernetes
  AGENT_PLATFORM_WORKLOAD_IDENTITY_AUDIENCE: mandate-api
  AGENT_PLATFORM_WORKLOAD_IDENTITY_REQUIRED_SCOPES: worker_service
  AGENT_PLATFORM_WORKLOAD_IDENTITY_ALLOWED_SUBJECTS_JSON: '{"worker_service":["data.workspace_probe","opencode.apply_executor","opencode.proposer"]}'
  AGENT_PLATFORM_HOSTED_HARNESS_SAFE_FLOOR_EVIDENCE: deployment_attestation
  AGENT_PLATFORM_HOSTED_HARNESS_SAFE_FLOOR_EGRESS_JAIL: "true"
  AGENT_PLATFORM_HOSTED_HARNESS_SAFE_FLOOR_NO_AMBIENT_CREDENTIALS: "true"
  AGENT_PLATFORM_HOSTED_HARNESS_SAFE_FLOOR_MODEL_GATEWAY: "true"
  AGENT_PLATFORM_HOSTED_HARNESS_SAFE_FLOOR_COST_CUTOFF: "true"
  AGENT_PLATFORM_HOSTED_HARNESS_SAFE_FLOOR_CONSEQUENCE_ENFORCEMENT: "true"
  AGENT_PLATFORM_HOSTED_HARNESS_SAFE_FLOOR_AUDIT: "true"

skills:
  enabled: true
  configMapName: mandate-skill-packs
  mountPath: /var/lib/mandate/skills

migrations:
  enabled: true
  useHelmHooks: false
  useArgoHooks: true
  disableStartupSchemaMigration: true

localWorker:
  enabled: true
  replicaCount: 1
  capabilities: task.echo,approval.probe,readonly_sql,audit.digest,mandate.ops.inspect,mandate.deploy.smoke
  pollSeconds: 2
  batchSize: 1

callbackAdapter:
  enabled: true
  replicaCount: 1
  sink: http
  secretKeys:
    - AGENT_PLATFORM_OPENCLAW_CALLBACK_URL
    - AGENT_PLATFORM_OPENCLAW_CALLBACK_TOKEN
    - AGENT_PLATFORM_DISCORD_BOT_TOKEN
  pollSeconds: 2
  batchSize: 10
  leaseSeconds: 60
  discordThreads:
    enabled: true
    autoArchiveMinutes: 1440

gitDeliverer:
  enabled: true
  replicaCount: 1
  secretKeys:
    - AGENT_PLATFORM_GIT_DELIVERY_GITHUB_TOKEN
  pollSeconds: 5
  batchSize: 10
  claimStaleSeconds: 300
  targetRepo: cesaregarza/mandate-sandbox
  remoteUrl: https://github.com/cesaregarza/mandate-sandbox
  baseRef: main
  allowedBaseRepos:
    - https://github.com/cesaregarza/mandate-sandbox

modelGateway:
  enabled: true
  replicaCount: 1
  env:
    AGENT_PLATFORM_PROVIDER_DIGEST_PINS_JSON: '{"model_gateway":{"digest":"sha256:dbb0d981c69e9d6f9ba7b2ce1de76f1e9eb88381f81be65314bfc9c4b5fa3a69","protocol":"model_gateway"}}'
  codexAuthPersistence:
    enabled: true
    accessModes:
      - ReadWriteOnce
    storageClassName: do-block-storage
    size: 1Gi

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: true
  className: nginx
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - agent-control-plane.garz.ai
  tls:
    enabled: true
    secretName: agent-control-plane-tls
    certificate:
      enabled: true
      issuerName: letsencrypt-prod
      dnsNames: []

networkPolicy:
  enabled: true
  ingress:
    sources:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: ingress-nginx
        podSelector:
          matchLabels:
            app.kubernetes.io/name: ingress-nginx
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: agent-workloads
        podSelector:
          matchLabels:
            app.kubernetes.io/name: agent-workloads
            app.kubernetes.io/instance: agent-workloads
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: agent-workloads
        podSelector:
          matchLabels:
            app.kubernetes.io/name: opencode-proposer
            app.kubernetes.io/instance: agent-workloads
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: monitoring
        podSelector:
          matchLabels:
            app.kubernetes.io/name: splattop
            app.kubernetes.io/instance: splattop-prod
            app.kubernetes.io/component: prometheus
    ports:
      - port: 8000
        protocol: TCP
      - port: 9090
        protocol: TCP
  egress:
    dns:
      enabled: true
      destinations:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    destinations:
      - ipBlock:
          cidr: 10.108.0.0/20
        ports:
          - port: 25060
            protocol: TCP
      - ipBlock:
          cidr: 0.0.0.0/0
        ports:
          - port: 443
            protocol: TCP

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

extraVolumes:
  - name: registry-overlay
    configMap:
      name: agent-control-plane-registry-overlay
  - name: model-gateway-controls
    configMap:
      name: agent-control-plane-model-gateway-controls

extraVolumeMounts:
  - name: registry-overlay
    mountPath: /app/registries/workload_imports.yaml
    subPath: workload_imports.yaml
    readOnly: true
  - name: registry-overlay
    mountPath: /app/registries/policy.prod.yaml
    subPath: policy.prod.yaml
    readOnly: true
  - name: registry-overlay
    mountPath: /app/registries/evals.yaml
    subPath: evals.yaml
    readOnly: true
  - name: registry-overlay
    mountPath: /app/registries/imports
    readOnly: true
  - name: model-gateway-controls
    mountPath: /app/model-gateway-controls
    readOnly: true

postgresSweep:
  enabled: true

syntheticLiveVerify:
  enabled: true
  schedule: "*/5 * * * *"
  baseUrl: http://agent-control-plane:80
  principal:
    issuer: synthetic
    subject_id: mandate-live-probe
    subject_kind: service
    tenant_id: garzai-prod
    roles:
      - synthetic_probe
    provenance:
      source: synthetic-live-verify
      identifiers:
        tenant_ref: garzai-prod
        subject_ref: mandate-live-probe
  deliveryTarget:
    kind: internal
    target_ref: synthetic-live-verify
    message_ref: scheduled-synthetic-live-verify
  surfaceContext:
    source: synthetic-live-verify
    surface_ref: synthetic-live-verify
    adapter_provenance:
      source: synthetic-live-verify
      identifiers:
        probe: scheduled
  trustedContext:
    entitlements: []
    attachment_authorities: []
  journeys:
    - id: deployment-smoke
      capability_id: mandate.deploy.smoke
      text: Run the deployment smoke probe and return the deployment marker.
      max_cost_usd: 0.05
      max_runtime_seconds: 60
      timeout_seconds: 120
      poll_seconds: 5
      expected_status: succeeded
      required_result_fields:
        - output_text
        - schema_version
      required_callback_types:
        - job.accepted
        - job.progress
        - job.succeeded
      required_event_types:
        - run.created
        - policy.evaluated
        - result.released
    - id: readonly-query-skill-digests
      capability_id: agent_workloads.readonly_query
      text: Show 3 recent X Power schedule windows from xscraper.schedules.
      max_cost_usd: 1.0
      max_runtime_seconds: 60
      timeout_seconds: 180
      poll_seconds: 5
      expected_status: succeeded
      required_result_fields:
        - output_text
      required_callback_types:
        - job.accepted
        - job.progress
        - job.succeeded
      required_event_types:
        - run.created
        - policy.evaluated
        - tool.started
        - result.released
      required_skill_ids:
        - xscraper-schema
        - xscraper-glossary
