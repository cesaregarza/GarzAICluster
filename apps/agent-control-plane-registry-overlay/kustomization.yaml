apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agent-control-plane

resources:
  - restart-rbac.yaml

generatorOptions:
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/name: agent-control-plane
    app.kubernetes.io/component: registry-overlay

configMapGenerator:
  - name: agent-control-plane-registry-overlay
    files:
      - workload_imports.yaml=registry/workload_imports.yaml
      - policy.prod.yaml=registry/policy.prod.yaml
      - evals.yaml=registry/evals.yaml
      - agent-data.workspace_probe.json=registry/imports/agent-data.workspace_probe.json
      - agent-opencode.proposer.json=registry/imports/agent-opencode.proposer.json
      - agent-opencode.apply_executor.json=registry/imports/agent-opencode.apply_executor.json
      - opencode_proposer_smoke.jsonl=registry/imports/opencode_proposer_smoke.jsonl
      - opencode_apply_smoke.jsonl=registry/imports/opencode_apply_smoke.jsonl
