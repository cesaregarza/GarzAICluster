apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-control-plane-registry-overlay
  namespace: agent-control-plane
  labels:
    app.kubernetes.io/name: agent-control-plane
    app.kubernetes.io/component: registry-overlay
data:
  workload_imports.yaml: |
{{ .Files.Get "registry/workload_imports.yaml" | indent 4 }}
  policy.prod.yaml: |
{{ .Files.Get "registry/policy.prod.yaml" | indent 4 }}
  evals.yaml: |
{{ .Files.Get "registry/evals.yaml" | indent 4 }}
{{- range $path, $_ := .Files.Glob "registry/imports/*" }}
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
