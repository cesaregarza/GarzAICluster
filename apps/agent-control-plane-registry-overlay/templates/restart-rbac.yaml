apiVersion: v1
kind: ServiceAccount
metadata:
  name: registry-overlay-restart
  namespace: agent-control-plane
  labels:
    app.kubernetes.io/name: agent-control-plane
    app.kubernetes.io/component: registry-overlay-restart
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: registry-overlay-restart
  namespace: agent-control-plane
  labels:
    app.kubernetes.io/name: agent-control-plane
    app.kubernetes.io/component: registry-overlay-restart
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames:
      - agent-control-plane
      - agent-control-plane-model-gateway
      - agent-control-plane-callback-adapter
      - agent-control-plane-git-deliverer
      - agent-control-plane-local-worker
    verbs: ["get", "patch"]
  # Generated pod names cannot be constrained with resourceNames. List-only
  # access is the narrowest permission that lets the hook capture each
  # component's pre-restart pods and wait for their full deletion.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: registry-overlay-restart
  namespace: agent-control-plane
  labels:
    app.kubernetes.io/name: agent-control-plane
    app.kubernetes.io/component: registry-overlay-restart
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: registry-overlay-restart
subjects:
  - kind: ServiceAccount
    name: registry-overlay-restart
    namespace: agent-control-plane
