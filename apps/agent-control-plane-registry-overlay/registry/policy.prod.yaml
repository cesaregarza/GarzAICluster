defaults:
  max_cost_usd_per_job: 0.25
  max_runtime_seconds_per_job: 60
  aggregate_budget:
    platform_daily_usd: 250.0
    per_capability_daily_usd_default: 100.0
    per_capability_daily_usd:
      agent_workloads.opencode_apply: 1.0
      agent_workloads.opencode_propose: 1.0

bindings:
  - id: private-admin-controlled-capabilities
    description: Production-safe private admin binding for no-key probes, bounded read-only SQL, and imported worker-service capabilities.
    guild_id: "614277943706910722"
    channel_id: "1480483954694819940"
    users:
      admins:
        - "94265880216612864"
      authorized:
        - "94265880216612864"
    capabilities:
      allow:
        - task.echo
        - approval.probe
        - readonly_sql
        - audit.digest
        - mandate.ops.inspect
        - mandate.deploy.smoke
        - agent_workloads.db_probe
        - agent_workloads.readonly_query
        - agent_workloads.opencode_apply
        - agent_workloads.opencode_propose
        - agent_workloads.opencode_task
        - agent_workloads.opencode_orchestrate
      approval_overrides:
        approval.probe: admin_confirm
        agent_workloads.opencode_apply: admin_confirm

  - id: synthetic-live-verify-probe
    description: Scheduled no-key deployment smoke probe. This binding stays narrower than private-admin access so CronJob credentials can prove the live submit/worker/output/callback path without gaining operator capabilities.
    guild_id: "614277943706910722"
    channel_id: "1480483954694819940"
    users:
      admins: []
      authorized:
        - mandate-live-probe
    capabilities:
      allow:
        - mandate.deploy.smoke
