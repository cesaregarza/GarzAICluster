apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agent-control-plane

generatorOptions:
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/name: agent-control-plane
    app.kubernetes.io/component: skills
    garz.ai/source: operator-curated-skill-bundle

configMapGenerator:
  - name: mandate-skill-packs
    files:
      - manifest.json=bundle/manifest.json
      - xscraper-schema.md=bundle/xscraper-schema.md
      - xscraper-glossary.md=bundle/xscraper-glossary.md
