apiVersion: v1
kind: ServiceAccount
metadata:
  name: mandate-skill-bundle-sync
  namespace: agent-control-plane
  labels:
    app.kubernetes.io/name: agent-control-plane
    app.kubernetes.io/component: skills
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mandate-skill-bundle-sync
  namespace: agent-control-plane
  labels:
    app.kubernetes.io/name: agent-control-plane
    app.kubernetes.io/component: skills
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    resourceNames:
      - mandate-skill-packs
    verbs:
      - get
      - patch
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mandate-skill-bundle-sync
  namespace: agent-control-plane
  labels:
    app.kubernetes.io/name: agent-control-plane
    app.kubernetes.io/component: skills
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mandate-skill-bundle-sync
subjects:
  - kind: ServiceAccount
    name: mandate-skill-bundle-sync
    namespace: agent-control-plane
