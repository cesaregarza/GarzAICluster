apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# This payload is intentionally not referenced by argocd/applications/root.yaml.
# It creates no LoadBalancer Service; activation is an operator-gated action.
namespace: ingress-nginx
resources:
  - serviceaccount.yaml
  - rbac.yaml
  - ingressclass.yaml
  - deployment.yaml
  - service.yaml
  - pdb.yaml
