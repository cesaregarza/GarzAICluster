apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gaic-traefik-ingress
  labels:
    app.kubernetes.io/name: gaic-traefik-ingress
    app.kubernetes.io/instance: gaic-traefik-ingress
    app.kubernetes.io/part-of: gaic-ingress-migration
rules:
  - apiGroups: [""]
    resources:
      - configmaps
      - nodes
      - services
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [list, watch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [list, watch]
  - apiGroups: [networking.k8s.io]
    resources:
      - ingressclasses
      - ingresses
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gaic-traefik-ingress
  labels:
    app.kubernetes.io/name: gaic-traefik-ingress
    app.kubernetes.io/instance: gaic-traefik-ingress
    app.kubernetes.io/part-of: gaic-ingress-migration
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gaic-traefik-ingress
subjects:
  - kind: ServiceAccount
    name: gaic-traefik-ingress
    namespace: ingress-nginx
