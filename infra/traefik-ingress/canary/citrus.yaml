apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: citrus-traefik-canary
  namespace: default
  labels:
    app.kubernetes.io/part-of: gaic-ingress-migration-canary
spec:
  ingressClassName: traefik-nginx
  tls:
    - hosts:
        - citrus-grace.com
        - www.citrus-grace.com
      secretName: citrus-grace-tls
  rules:
    - host: citrus-grace.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: citrus-service
                port:
                  number: 80
    - host: www.citrus-grace.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: citrus-service
                port:
                  number: 80
