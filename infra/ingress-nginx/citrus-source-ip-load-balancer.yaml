# CES-748 operator-only blue/green load balancer.
#
# This file is deliberately not referenced by Argo CD, Helm, or Kustomize.
# It records the spare load balancer and leaves the current 143 REGIONAL
# load balancer and its Service unchanged for immediate rollback.  It contains
# no legacy-controller PDB: the old selector would be recreated accidentally
# by applying this operator payload after the Traefik transition.
apiVersion: v1
kind: Service
metadata:
  name: ingress-nginx-controller-source-ip
  namespace: ingress-nginx
  annotations:
    service.beta.kubernetes.io/do-loadbalancer-name: citrus-source-ip
    service.beta.kubernetes.io/do-loadbalancer-type: REGIONAL_NETWORK
  labels:
    app.kubernetes.io/component: controller
    app.kubernetes.io/instance: ingress-nginx
    app.kubernetes.io/name: ingress-nginx
    app.kubernetes.io/part-of: ingress-nginx
spec:
  externalTrafficPolicy: Local
  ports:
    - appProtocol: http
      name: http
      port: 80
      protocol: TCP
      targetPort: http
    - appProtocol: https
      name: https
      port: 443
      protocol: TCP
      targetPort: https
  selector:
    app.kubernetes.io/instance: gaic-traefik-ingress
    app.kubernetes.io/name: gaic-traefik-ingress
  type: LoadBalancer
